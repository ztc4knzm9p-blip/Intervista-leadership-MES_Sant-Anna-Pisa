<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test compatibilità</title><style>body{font-family:Arial;padding:24px;max-width:680px;margin:auto} .box{padding:14px;border:1px solid #bbb;border-radius:10px;margin:12px 0}.ok{background:#edf5ef}.bad{background:#fbeaea}button{font-size:17px;padding:12px 16px}</style><h1>Test compatibilità modulo</h1><div id="js" class="box bad"><b>JavaScript non attivo.</b> Se questo messaggio resta visibile, questa anteprima non può usare i pulsanti del questionario.</div><div id="storage" class="box">Storage: non verificato</div><button id="b" type="button">Prova pulsante e download</button><div id="r" class="box">Nessuna prova eseguita.</div><script>document.getElementById('js').className='box ok';document.getElementById('js').innerHTML='<b>JavaScript attivo.</b> Protocollo: '+location.protocol;let s=false;try{localStorage.setItem('__t','1');localStorage.removeItem('__t');s=true}catch(e){}document.getElementById('storage').className='box '+(s?'ok':'bad');document.getElementById('storage').textContent='Storage locale: '+(s?'disponibile':'non disponibile');document.getElementById('b').onclick=()=>{try{const u=URL.createObjectURL(new Blob(['TEST OK'],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download='test_modulo.txt';document.body.appendChild(a);a.click();a.remove();document.getElementById('r').className='box ok';document.getElementById('r').textContent='Pulsante eseguito. È stato richiesto il download di test_modulo.txt.'}catch(e){document.getElementById('r').className='box bad';document.getElementById('r').textContent='Errore: '+e}}</script></html>
